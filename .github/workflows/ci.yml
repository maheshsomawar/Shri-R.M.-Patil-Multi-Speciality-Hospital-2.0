name: Hospital HMS CI — Security, Migrations & Concurrency Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check all Python modules
        run: python3 -m py_compile server.py db.py migrations.py backup_db.py db_optimize.py security_audit.py traffic_sim.py

      - name: Verify idempotent SQLite migrations (Asia/Kolkata)
        run: |
          python3 migrations.py
          python3 migrations.py

      - name: Verify SQLite EXPLAIN QUERY PLAN index usage
        run: python3 db_optimize.py

      - name: Run 36-point Security, Privacy, RBAC & Refund Audit
        run: python3 security_audit.py

      - name: Run 380-request Concurrent Traffic & Double-Booking Race Simulation
        run: python3 traffic_sim.py
