services:
  hospital-app:
    build: .
    container_name: shri-rm-patil-hms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DB_PATH=/app/data/hospital.db
      - DEBUG=false
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
